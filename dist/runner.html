<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1420">
<title>金币之路 · 3D 跑酷</title>
<style>
:root {
  --gold: #ffc94d;
  --gold-dark: #b8860b;
  --ink: #0d1420;
  --good: #3ddc97;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--ink);
  color: #eef2f8;
  font: 14px/1.4 -apple-system, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  user-select: none;
}

#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#fatal {
  display: none;
  position: absolute;
  inset: 0;
  padding: 30px;
  background: #14161a;
  color: #ff9a9a;
  font: 13px/1.6 monospace;
  z-index: 100;
  white-space: pre-wrap;
}

#hud {
  position: absolute;
  top: env(safe-area-inset-top, 0);
  left: 0; right: 0;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  z-index: 10;
  pointer-events: none;
}
#hud button { pointer-events: auto; }

.hud-left { display: flex; align-items: center; gap: 10px; }
.hud-right { display: flex; align-items: center; gap: 10px; }

.coin-chip, .gate-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 13px;
  border-radius: 999px;
  background: rgba(10, 16, 26, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.12);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  backdrop-filter: blur(8px);
  font-size: 14px;
}

.coin-icon {
  width: 15px; height: 15px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff3c4, var(--gold) 45%, var(--gold-dark));
  box-shadow: 0 0 8px rgba(255, 201, 77, 0.7);
}

#coin-count { color: var(--gold); }

.gate-chip { font-size: 13px; color: #b9c4d4; }
.gate-chip b { font-weight: 700; }
.gate-chip b.locked { color: #ff8080; }
.gate-chip b.open { color: var(--good); }

#fps { font-size: 11px; color: rgba(255, 255, 255, 0.4); font-variant-numeric: tabular-nums; }

button {
  appearance: none;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(10, 16, 26, 0.55);
  color: #eef2f8;
  border-radius: 10px;
  font: inherit;
  cursor: pointer;
  backdrop-filter: blur(8px);
}
button:active { transform: scale(0.96); }
button.ghost { width: 34px; height: 34px; font-size: 17px; line-height: 1; }

#coin-track {
  position: absolute;
  top: calc(54px + env(safe-area-inset-top, 0px));
  left: 14px;
  width: 132px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.14);
  z-index: 10;
  overflow: hidden;
}
#coin-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold));
  box-shadow: 0 0 8px rgba(255, 201, 77, 0.8);
  transition: width 0.2s ease;
}

#progress {
  position: absolute;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  left: 14px;
  right: 14px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.12);
  z-index: 10;
  overflow: hidden;
}
#progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #3aa0ff, var(--good));
  transition: width 0.12s linear;
}

#controls {
  position: absolute;
  bottom: calc(30px + env(safe-area-inset-bottom, 0px));
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 16px;
  z-index: 10;
}
.pad {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  font-size: 22px;
  display: grid;
  place-items: center;
  background: rgba(16, 24, 38, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.14);
}
.pad.jump {
  width: 78px;
  height: 78px;
  font-size: 17px;
  background: rgba(58, 160, 255, 0.28);
  border-color: rgba(58, 160, 255, 0.55);
  margin-top: -8px;
}

@media (hover: hover) and (pointer: fine) {
  #controls { display: none; }
}

#toast {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  padding: 12px 22px;
  border-radius: 14px;
  background: rgba(12, 20, 32, 0.86);
  border: 1px solid rgba(255, 201, 77, 0.5);
  color: var(--gold);
  font-weight: 700;
  font-size: 15px;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 20;
  pointer-events: none;
  text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

#overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(6, 10, 18, 0.72);
  backdrop-filter: blur(6px);
  z-index: 30;
  padding: 24px;
}
#overlay.hidden { display: none; }

.card {
  width: min(340px, 92vw);
  text-align: center;
  padding: 26px 22px 20px;
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 36, 0.98));
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
}

.card h1 {
  margin: 0 0 8px;
  font-size: 24px;
  letter-spacing: 1px;
  background: linear-gradient(90deg, #fff3c4, var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

#overlay[data-kind="lost"] .card h1 {
  background: linear-gradient(90deg, #ffb3b3, #ff5c5c);
  -webkit-background-clip: text;
  background-clip: text;
}

#overlay[data-kind="won"] .card h1 {
  background: linear-gradient(90deg, #b8ffd9, var(--good));
  -webkit-background-clip: text;
  background-clip: text;
}

.card p {
  margin: 0 0 18px;
  color: #b9c4d4;
  font-size: 13.5px;
  line-height: 1.6;
}

.card button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  color: #17130a;
  background: linear-gradient(180deg, #ffe08a, var(--gold));
  border: none;
}
.card button:active { transform: scale(0.985); }

.card .tip {
  margin: 14px 0 0;
  font-size: 11.5px;
  color: rgba(255, 255, 255, 0.35);
}

@media (max-width: 420px) {
  .coin-chip, .gate-chip { font-size: 12.5px; padding: 6px 10px; }
  #coin-track { width: 104px; }
}

</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="fatal"></div>

<header id="hud">
  <div class="hud-left">
    <div class="coin-chip">
      <span class="coin-icon"></span>
      <span id="coin-count">0 / 0</span>
    </div>
    <div class="gate-chip">
      终点门 <b id="gate-state" class="locked">锁定</b>
    </div>
  </div>
  <div class="hud-right">
    <span id="fps">--</span>
    <button data-action="restart" class="ghost" title="重新开始">↻</button>
  </div>
</header>

<div id="coin-track"><div id="coin-bar"></div></div>
<div id="progress"><div id="progress-fill"></div></div>

<div id="toast"></div>

<div id="controls">
  <button data-action="left" class="pad">‹</button>
  <button data-action="jump" class="pad jump">跳</button>
  <button data-action="right" class="pad">›</button>
</div>

<div id="overlay" class="hidden">
  <div class="card">
    <h1 id="ov-title">金币之路</h1>
    <p id="ov-sub"></p>
    <button id="ov-btn" data-action="start">开始跑酷</button>
    <p class="tip">键盘：← → 换道，空格跳跃，R 重开</p>
  </div>
</div>
