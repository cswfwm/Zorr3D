<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zorr3D 编辑器</title>
<style>
:root {
  --bg: #14161a;
  --panel: #1c1f25;
  --panel-2: #23272f;
  --line: #2e333d;
  --text: #d8dde6;
  --text-dim: #8a93a3;
  --accent: #4c9aff;
  --accent-2: #7c5cff;
  --danger: #ff5c5c;
  --top-h: 44px;
  --status-h: 26px;
  --side-w: 250px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 -apple-system, "Noto Sans CJK SC", "Source Han Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  user-select: none;
}

#viewport {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: default;
}

/* ---------- 顶栏 ---------- */

#topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: var(--top-h);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 8px;
  background: rgba(20, 22, 26, 0.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
  z-index: 20;
  overflow-x: auto;
  scrollbar-width: none;
}
#topbar::-webkit-scrollbar { display: none; }

.brand {
  font-weight: 700;
  letter-spacing: .5px;
  color: var(--accent);
  margin-right: 6px;
  white-space: nowrap;
}

button {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, border-color .12s;
}
button:hover { background: #2c313a; }
button:active { transform: translateY(1px); }
button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
button.icon { padding: 5px 8px; font-size: 14px; }
button#btn-play.active { background: var(--danger); border-color: var(--danger); }

.sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; flex: none; }
.grow { flex: 1; }
#fps { color: var(--text-dim); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 62px; text-align: right; }

/* ---------- 面板 ---------- */

.panel {
  position: absolute;
  top: var(--top-h);
  bottom: var(--status-h);
  width: var(--side-w);
  background: rgba(28, 31, 37, 0.96);
  border-right: 1px solid var(--line);
  z-index: 15;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(8px);
  transition: transform .18s ease;
}
#outliner { left: 0; }
#inspector { right: 0; border-right: none; border-left: 1px solid var(--line); }
#viewpanel { right: 0; border-right: none; border-left: 1px solid var(--line); width: 230px; }

.panel.hidden { display: none; }
.panel.collapsed { transform: translateX(-100%); }
#inspector.collapsed, #viewpanel.collapsed { transform: translateX(100%); }

.panel-title {
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  letter-spacing: .4px;
}
.panel-title .x {
  margin-left: auto;
  border: none;
  background: none;
  color: var(--text-dim);
  font-size: 16px;
  padding: 0 4px;
  cursor: pointer;
}

#tree { overflow-y: auto; flex: 1; padding: 6px 4px 20px; }
#inspector-body, #view-body { overflow-y: auto; flex: 1; padding: 8px 10px 24px; }

/* 层级树 */
.node-row {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 6px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12.5px;
  white-space: nowrap;
}
.node-row:hover { background: #262b33; }
.node-row.selected { background: rgba(76, 154, 255, 0.22); color: #fff; }
.node-row .eye { opacity: .6; font-size: 11px; width: 14px; text-align: center; }
.node-row .eye.off { opacity: .22; }
.node-row .kind { color: var(--text-dim); font-size: 11px; }
.node-row .name { overflow: hidden; text-overflow: ellipsis; }
.node-row .caret { width: 10px; color: var(--text-dim); font-size: 9px; }
.node-children { margin-left: 13px; border-left: 1px solid #262b33; padding-left: 3px; }

/* 属性组 */
.group { margin-bottom: 14px; }
.group h4 {
  margin: 0 0 6px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--text-dim);
  font-weight: 600;
}
.field {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
}
.field label { width: 62px; color: var(--text-dim); font-size: 12px; flex: none; }
.field input[type="text"], .field input[type="number"], .field select, .field input[type="color"] {
  flex: 1;
  min-width: 0;
  background: #14161a;
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 5px;
  padding: 4px 6px;
  font-size: 12px;
  font-family: inherit;
  font-variant-numeric: tabular-nums;
}
.field input[type="color"] { padding: 1px; height: 26px; cursor: pointer; }
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
.field input[type="range"] { flex: 1; accent-color: var(--accent); }

.vec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; flex: 1; }
.vec input { width: 100%; }

.hint { color: var(--text-dim); font-size: 11.5px; line-height: 1.5; }
.row-btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.row-btns button { flex: 1; }
.danger { color: var(--danger); border-color: #4a2b2b; }

.empty { color: var(--text-dim); padding: 20px 6px; text-align: center; font-size: 12px; }

/* ---------- 工具栏 ---------- */

#toolbar {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--status-h) + 10px);
  display: flex;
  gap: 4px;
  padding: 5px;
  background: rgba(28, 31, 37, 0.94);
  border: 1px solid var(--line);
  border-radius: 9px;
  z-index: 18;
  backdrop-filter: blur(8px);
}
#toolbar button { font-size: 12px; padding: 5px 10px; }

/* ---------- 状态栏 ---------- */

#statusbar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: var(--status-h);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
  background: rgba(20, 22, 26, 0.96);
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--text-dim);
  z-index: 20;
}
#stats { font-variant-numeric: tabular-nums; }

/* ---------- 浮动提示 ---------- */

#hud { position: absolute; inset: 0; pointer-events: none; z-index: 30; }

#toast {
  position: absolute;
  left: 50%;
  top: calc(var(--top-h) + 12px);
  transform: translateX(-50%) translateY(-8px);
  background: rgba(30, 34, 42, 0.96);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 12.5px;
  opacity: 0;
  transition: opacity .18s, transform .18s;
  max-width: 80vw;
  text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { border-color: #6b2f2f; color: #ffb4b4; }

#drop-hint {
  position: absolute;
  inset: 40px 0 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--accent);
  background: rgba(20, 30, 50, 0.75);
  border: 2px dashed var(--accent);
  border-radius: 12px;
  margin: 12px;
}
body.dragging #drop-hint { display: flex; }

/* 弹出菜单 */
.popover {
  position: absolute;
  top: calc(var(--top-h) + 4px);
  left: 120px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 5px;
  z-index: 25;
  min-width: 150px;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
}
.popover.hidden { display: none; }
.popover button {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: none;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 12.5px;
}
.popover button:hover { background: var(--panel-2); }

/* 窄屏：面板变为抽屉，默认收起 */
@media (max-width: 820px) {
  :root { --side-w: 46vw; }
  #outliner { transform: translateX(-100%); }
  #inspector { transform: translateX(100%); }
  #viewpanel { transform: translateX(100%); }
  #outliner.open, #inspector.open, #viewpanel.open { transform: translateX(0); }
  #toolbar { bottom: calc(var(--status-h) + 6px); padding: 4px; }
  #toolbar button { padding: 4px 7px; font-size: 11px; }
  .brand { display: none; }
}

/* 桌面宽屏：面板常驻 */
@media (min-width: 821px) {
  .panel { }
}

</style>
</head>
<body>
<canvas id="viewport"></canvas>

<div id="hud">
  <div id="toast"></div>
  <div id="drop-hint">松开以导入 .glb / .gltf / .obj</div>
</div>

<header id="topbar">
  <span class="brand">Zorr3D</span>
  <button data-act="new" title="新建场景">新建</button>
  <button data-act="open" title="打开场景 JSON">打开</button>
  <button data-act="save" title="保存场景到文件">保存</button>
  <span class="sep"></span>
  <button data-act="add" title="添加物体">＋ 添加</button>
  <button data-act="import" title="导入模型">导入模型</button>
  <span class="sep"></span>
  <button data-act="undo" title="撤销 (Ctrl+Z)">↶</button>
  <button data-act="redo" title="重做 (Ctrl+Shift+Z)">↷</button>
  <span class="sep"></span>
  <button data-act="play" id="btn-play" title="运行/停止">▶ 运行</button>
  <span class="grow"></span>
  <span id="fps">-- FPS</span>
  <button data-act="panel-view" class="icon" title="显示选项">⚙</button>
  <button data-act="panel-outliner" class="icon" title="层级">☰</button>
  <button data-act="panel-inspector" class="icon" title="属性">▤</button>
</header>

<aside id="outliner" class="panel">
  <div class="panel-title">层级<button class="x" data-act="close-outliner">×</button></div>
  <div id="tree"></div>
</aside>

<aside id="inspector" class="panel">
  <div class="panel-title">属性<button class="x" data-act="close-inspector">×</button></div>
  <div id="inspector-body"></div>
</aside>

<aside id="viewpanel" class="panel hidden">
  <div class="panel-title">显示与画质<button class="x" data-act="close-view">×</button></div>
  <div id="view-body"></div>
</aside>

<div id="add-menu" class="popover hidden"></div>

<div id="toolbar">
  <button data-tool="select" class="active" title="选择 (Q)">Q 选择</button>
  <button data-tool="move" title="移动 (W)">W 移动</button>
  <button data-tool="rotate" title="旋转 (E)">E 旋转</button>
  <button data-tool="scale" title="缩放 (R)">R 缩放</button>
  <span class="sep"></span>
  <button data-gizmo="world" id="btn-space" title="切换世界/局部坐标">世界</button>
  <button data-act="frame" title="聚焦选中 (F)">聚焦</button>
</div>

<footer id="statusbar">
  <span id="status-text">就绪</span>
  <span class="grow"></span>
  <span id="stats"></span>
</footer>

<input type="file" id="file-open" accept=".json,.z3d,application/json" hidden>
<input type="file" id="file-model" accept=".glb,.gltf,.obj" hidden>
